definitions:
  models.AuthRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.CSPReportCreateDTO:
    properties:
      age:
        type: integer
      body:
        $ref: '#/definitions/models.ReportBody'
      type:
        type: string
      url:
        type: string
      user_agent:
        type: string
    type: object
  models.ChangePasswordRequest:
    properties:
      confirmNewPassword:
        type: string
      currentPassword:
        type: string
      newPassword:
        type: string
    required:
    - confirmNewPassword
    - currentPassword
    - newPassword
    type: object
  models.ProjectUpsertDTO:
    properties:
      description:
        type: string
      disabled:
        type: boolean
      name:
        type: string
      teamId:
        type: string
    required:
    - name
    - teamId
    type: object
  models.RefreshTokenRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  models.ReportBody:
    properties:
      blockedURL:
        type: string
      columnNumber:
        type: integer
      disposition:
        type: string
      documentURL:
        type: string
      effectiveDirective:
        type: string
      lineNumber:
        type: integer
      originalPolicy:
        type: string
      referrer:
        type: string
      sample:
        type: string
      scriptSample:
        type: string
      sourceFile:
        type: string
    type: object
  models.SetDefaultProjectRequest:
    properties:
      projectID:
        type: string
    required:
    - projectID
    type: object
  models.TeamUpsertDTO:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  models.UserRegisterDTO:
    properties:
      confirmPassword:
        type: string
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - confirmPassword
    - email
    - firstName
    - lastName
    - password
    - username
    type: object
  models.UserUpdateDTO:
    properties:
      disabled:
        type: boolean
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      role:
        type: string
      teamId:
        type: string
      username:
        type: string
    required:
    - email
    - firstName
    - lastName
    - role
    - username
    type: object

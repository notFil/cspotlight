name: Run SAST
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  gosec:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    defaults:
      run:
        working-directory: ./backend
    steps:
    - name: Checkout Source
      uses: actions/checkout@v3
    - name: Run gosec
      uses: securego/gosec-action@v2
      with:
        args: ./...